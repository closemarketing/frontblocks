<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Reading Progress fixture – FrontBlocks</title>
	<style>
		body { margin: 0; }
		.frbl-reading-progress-bar {
			position: fixed;
			top: 0;
			right: 0;
			width: 6px;
			height: 100vh;
			background: #e5e7eb;
			z-index: 9999;
		}
		.frbl-reading-progress-fill {
			width: 100%;
			height: 0%;
			background: #3b82f6;
			transition: height 0.1s linear;
		}
		article {
			height: 3000px;
			padding: 20px;
		}
	</style>
</head>
<body>
	<div class="frbl-reading-progress-bar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" role="progressbar">
		<div class="frbl-reading-progress-fill" id="progress-fill"></div>
	</div>

	<article id="main-article">
		<h1>Long article</h1>
		<p>Scroll down to see progress update.</p>
	</article>

	<script src="/assets/reading-progress/frontblocks-reading-progress.js"></script>
</body>
</html>
