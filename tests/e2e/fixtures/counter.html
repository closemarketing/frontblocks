<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Counter fixture – FrontBlocks</title>
</head>
<body>
	<!-- Counter 1: basic integer -->
	<span
		id="counter-1"
		class="frontblocks-counter-active"
		data-counter-target="500"
		data-counter-duration="500"
	>0</span>

	<!-- Counter 2: with prefix and suffix -->
	<span
		id="counter-2"
		class="frontblocks-counter-active"
		data-counter-target="100"
		data-counter-duration="500"
		data-counter-prefix="$"
		data-counter-suffix="K"
	>$0K</span>

	<!-- Counter 3: non-zero start value -->
	<span
		id="counter-3"
		class="frontblocks-counter-active"
		data-counter-target="200"
		data-counter-start="100"
		data-counter-duration="500"
	>100</span>

	<script src="/assets/counter/frontblocks-counter-runtime.js"></script>
</body>
</html>
