name: WordPress Playground Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  playground-preview:
    name: Build plugin & post Playground link
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Prepare plugin directory ─────────────────────────────────────────────
      # The artifact must contain frontblocks/ as a subdirectory so nightly.link
      # serves a zip with frontblocks/frontblocks.php inside — the structure
      # WordPress plugin installer expects.
      # Compiled JS assets are committed to git; no build step needed.
      # composer require is empty (only dev deps), so no vendor/ needed either.
      - name: Prepare plugin for artifact
        run: |
          mkdir -p /tmp/artifact/frontblocks
          rsync -av . /tmp/artifact/frontblocks/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.wordpress-playground' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='tests' \
            --exclude='phpcs.xml.dist' \
            --exclude='phpstan.neon.dist' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='tailwind.config.js' \
            --exclude='postcss.config.js' \
            --exclude='*.zip'

      # Upload the /tmp/artifact/ directory (NOT a pre-made zip).
      # upload-artifact preserves the frontblocks/ subdirectory structure.
      # nightly.link will serve the resulting artifact zip, which contains
      # frontblocks/ at the root — exactly what WordPress needs.
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontblocks
          path: /tmp/artifact/
          if-no-files-found: error
          retention-days: 7

      # ── Post PR comment with Playground link ─────────────────────────────────
      - name: Post Playground preview comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const prNumber  = context.payload.pull_request.number;
            const runId     = context.runId;
            const sha       = context.payload.pull_request.head.sha.slice(0, 7);
            const branch    = context.payload.pull_request.head.ref;

            // nightly.link makes GitHub Actions artifacts publicly downloadable.
            // Because we uploaded a directory (not a zip), the artifact zip
            // contains frontblocks/ at the root — correct plugin structure.
            const pluginZipUrl =
              `https://nightly.link/${owner}/${repo}/actions/runs/${runId}/frontblocks.zip`;

            const blueprint = {
              $schema: 'https://playground.wordpress.net/blueprint-schema.json',
              landingPage: '/wp-admin/post-new.php',
              preferredVersions: { wp: 'latest', php: '8.1' },
              features: { networking: true },
              steps: [
                { step: 'login', username: 'admin', password: 'password' },
                {
                  step: 'installPlugin',
                  pluginZipFile: {
                    resource: 'wordpress.org/plugins',
                    slug: 'generateblocks',
                  },
                },
                {
                  step: 'installPlugin',
                  pluginZipFile: { resource: 'url', url: pluginZipUrl },
                },
              ],
            };

            const encoded       = encodeURIComponent(JSON.stringify(blueprint));
            const playgroundUrl = `https://playground.wordpress.net/#${encoded}`;
            const artifactUrl   = `https://github.com/${owner}/${repo}/actions/runs/${runId}`;

            const body = [
              '## 🎪 WordPress Playground Preview',
              '',
              `**Branch:** \`${branch}\` · **Commit:** \`${sha}\``,
              '',
              `🔗 **[Open Preview in WordPress Playground](${playgroundUrl})**`,
              '',
              '**Lo que encontrarás:**',
              '- WordPress con GenerateBlocks + FrontBlocks desde esta PR',
              '- Usuario: `admin` · Contraseña: `password`',
              '- Aterriza en el editor de bloques (`/wp-admin/post-new.php`)',
              '',
              `📦 [Descargar artefacto ZIP](${artifactUrl})`,
              '',
              '<sub>Este comentario se actualiza automáticamente con cada push.</sub>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
            });

            const existing = comments.find(
              (c) =>
                c.user.type === 'Bot' &&
                c.body.includes('WordPress Playground Preview'),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
            }
