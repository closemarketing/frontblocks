name: WordPress Playground Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: write

jobs:
  playground-preview:
    name: Build plugin & post Playground link
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      # ── Build plugin zip ─────────────────────────────────────────────────────
      # Compiled JS assets are committed to git; no npm build step needed.
      # No production Composer deps (require: {}), so no vendor/ needed.
      - name: Create plugin zip
        run: |
          mkdir -p /tmp/plugin/frontblocks
          rsync -av . /tmp/plugin/frontblocks/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.wordpress-playground' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='tests' \
            --exclude='phpcs.xml.dist' \
            --exclude='phpstan.neon.dist' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='tailwind.config.js' \
            --exclude='postcss.config.js' \
            --exclude='*.zip'
          cd /tmp/plugin
          zip -r frontblocks.zip frontblocks/

      # ── Serve zip via playground-previews branch ─────────────────────────────
      # raw.githubusercontent.com is a public, auth-free URL for public repos.
      # WordPress Playground can fetch it directly without any proxy service.
      - name: Push zip to playground-previews branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # Clone playground-previews branch if it exists, otherwise create it orphan.
          if git ls-remote --exit-code --heads "$REPO_URL" playground-previews > /dev/null 2>&1; then
            git clone --branch playground-previews --depth 1 "$REPO_URL" /tmp/preview-branch
          else
            git clone --depth 1 "$REPO_URL" /tmp/preview-branch
            cd /tmp/preview-branch
            git checkout --orphan playground-previews
            git rm -rf . > /dev/null 2>&1 || true
            echo "# Playground Preview Artifacts" > README.md
            git add README.md
            git commit -m "init: playground-previews branch"
          fi

          # Copy the built zip into the PR slot.
          mkdir -p /tmp/preview-branch/pr-${PR_NUMBER}
          cp /tmp/plugin/frontblocks.zip /tmp/preview-branch/pr-${PR_NUMBER}/frontblocks.zip

          cd /tmp/preview-branch
          git add pr-${PR_NUMBER}/frontblocks.zip
          git commit -m "Preview: PR #${PR_NUMBER} — ${{ github.event.pull_request.head.sha }}" || echo "Nothing to commit"
          git push "$REPO_URL" HEAD:playground-previews

      # ── Post PR comment ──────────────────────────────────────────────────────
      - name: Post Playground preview comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const prNumber  = context.payload.pull_request.number;
            const sha       = context.payload.pull_request.head.sha.slice(0, 7);
            const branch    = context.payload.pull_request.head.ref;

            // raw.githubusercontent.com serves binary files from public repos
            // without authentication — Playground fetches it directly.
            const pluginZipUrl =
              `https://raw.githubusercontent.com/${owner}/${repo}/playground-previews/pr-${prNumber}/frontblocks.zip`;

            const blueprint = {
              $schema: 'https://playground.wordpress.net/blueprint-schema.json',
              landingPage: '/wp-admin/post-new.php',
              preferredVersions: { wp: 'latest', php: '8.1' },
              features: { networking: true },
              steps: [
                { step: 'login', username: 'admin', password: 'password' },
                {
                  step: 'installPlugin',
                  pluginZipFile: {
                    resource: 'wordpress.org/plugins',
                    slug: 'generateblocks',
                  },
                },
                {
                  step: 'installPlugin',
                  pluginZipFile: { resource: 'url', url: pluginZipUrl },
                },
              ],
            };

            const encoded       = encodeURIComponent(JSON.stringify(blueprint));
            const playgroundUrl = `https://playground.wordpress.net/#${encoded}`;

            const body = [
              '## 🎪 WordPress Playground Preview',
              '',
              `**Branch:** \`${branch}\` · **Commit:** \`${sha}\``,
              '',
              `🔗 **[Open Preview in WordPress Playground](${playgroundUrl})**`,
              '',
              '**Lo que encontrarás:**',
              '- WordPress con GenerateBlocks + FrontBlocks desde esta PR',
              '- Usuario: `admin` · Contraseña: `password`',
              '- Aterriza en el editor de bloques (`/wp-admin/post-new.php`)',
              '',
              '<sub>Este comentario se actualiza automáticamente con cada push.</sub>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
            });

            const existing = comments.find(
              (c) =>
                c.user.type === 'Bot' &&
                c.body.includes('WordPress Playground Preview'),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
            }
