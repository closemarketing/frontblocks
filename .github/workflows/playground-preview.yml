name: WordPress Playground Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  build-and-preview:
    name: Build plugin & post Playground link
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── PHP build ────────────────────────────────────────────────────────────
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies (no dev)
        run: composer install --no-dev --ignore-platform-reqs -o

      # ── JS build ─────────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies and build
        run: npm ci && npm run build

      # ── Create zip with correct plugin directory structure ───────────────────
      - name: Create plugin zip
        run: |
          mkdir -p /tmp/build/frontblocks
          rsync -av . /tmp/build/frontblocks/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.wordpress-playground' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='phpcs.xml.dist' \
            --exclude='phpstan.neon.dist' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='tailwind.config.js' \
            --exclude='postcss.config.js' \
            --exclude='*.zip'
          cd /tmp/build && zip -r frontblocks.zip frontblocks/

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontblocks
          path: /tmp/build/frontblocks.zip
          retention-days: 7

      # ── Post PR comment with Playground link ─────────────────────────────────
      - name: Post Playground preview comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const prNumber  = context.payload.pull_request.number;
            const runId     = context.runId;
            const sha       = context.payload.pull_request.head.sha.slice(0, 7);
            const branch    = context.payload.pull_request.head.ref;

            // nightly.link converts GitHub Actions artifacts into public URLs
            // so WordPress Playground can fetch the zip without authentication.
            const pluginZipUrl =
              `https://nightly.link/${owner}/${repo}/actions/runs/${runId}/frontblocks.zip`;

            const blueprint = {
              $schema: 'https://playground.wordpress.net/blueprint-schema.json',
              landingPage: '/wp-admin/post-new.php',
              preferredVersions: { wp: 'latest', php: '8.2' },
              features: { networking: true },
              steps: [
                { step: 'login', username: 'admin', password: 'password' },
                {
                  step: 'installPlugin',
                  pluginZipFile: {
                    resource: 'wordpress.org/plugins',
                    slug: 'generateblocks',
                  },
                },
                {
                  step: 'installPlugin',
                  pluginZipFile: { resource: 'url', url: pluginZipUrl },
                },
              ],
            };

            const encoded      = encodeURIComponent(JSON.stringify(blueprint));
            const playgroundUrl = `https://playground.wordpress.net/#${encoded}`;
            const artifactUrl   = `https://github.com/${owner}/${repo}/actions/runs/${runId}`;

            const body = [
              '## 🎪 WordPress Playground Preview',
              '',
              `**Branch:** \`${branch}\` · **Commit:** \`${sha}\``,
              '',
              `🔗 **[Open Preview in WordPress Playground](${playgroundUrl})**`,
              '',
              '**Lo que encontrarás:**',
              '- WordPress con GenerateBlocks + FrontBlocks (esta PR, con Composer build incluido)',
              '- Usuario: `admin` · Contraseña: `password`',
              '- Aterriza en el editor de bloques (`/wp-admin/post-new.php`)',
              '',
              `📦 [Descargar artefacto ZIP](${artifactUrl})`,
              '',
              '<sub>Este comentario se actualiza automáticamente con cada push.</sub>',
            ].join('\n');

            // Update existing bot comment instead of creating duplicates.
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
            });

            const existing = comments.find(
              (c) =>
                c.user.type === 'Bot' &&
                c.body.includes('WordPress Playground Preview'),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
            }
