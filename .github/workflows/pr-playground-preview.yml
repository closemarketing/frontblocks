name: PR Playground Preview

# Adds an official "Open in WordPress Playground" button to every pull request
# so reviewers can boot this PR's build of FrontBlocks in their browser with
# a single click.
#
# How it works:
# 1. Install Node dependencies and build JS assets.
# 2. Install Composer dependencies (without --dev).
# 3. Build a production zip honouring the existing .distignore.
# 4. Upload the zip as a workflow artifact.
# 5. Expose the artifact on a public download URL via the
#    WordPress/action-wp-playground-pr-preview helper.
# 6. Generate a blueprint that installs FrontBlocks from that URL, also
#    installs GenerateBlocks, and lands on the block editor.
# 7. Append the official "Open in WordPress Playground" button to the PR
#    description.
#
# References:
# - https://github.com/WordPress/action-wp-playground-pr-preview/tree/v2

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: write
  pull-requests: write

jobs:
  playground-preview:
    name: Build and post Playground preview button
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build JS assets
        run: npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
          coverage: none

      - name: Install production Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress --ignore-platform-reqs

      - name: Build plugin zip honouring .distignore
        env:
          PLUGIN_SLUG: frontblocks
        run: |
          mkdir -p "build/${PLUGIN_SLUG}"
          rsync -a --delete \
            --exclude-from='.distignore' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build' \
            ./ "build/${PLUGIN_SLUG}/"
          cd build
          zip -qr "${PLUGIN_SLUG}.zip" "${PLUGIN_SLUG}"
          ls -lh "${PLUGIN_SLUG}.zip"

      - name: Upload plugin zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontblocks-zip-pr${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: build/frontblocks.zip
          if-no-files-found: error
          retention-days: 5

      - name: Expose built artifact as a public URL
        id: expose
        uses: WordPress/action-wp-playground-pr-preview/.github/actions/expose-artifact-on-public-url@v2
        with:
          artifact-name:     frontblocks-zip-pr${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          artifact-filename: frontblocks.zip
          pr-number:         ${{ github.event.pull_request.number }}
          commit-sha:        ${{ github.event.pull_request.head.sha }}
          artifacts-to-keep: '2'

      - name: Generate Playground blueprint
        id: blueprint
        env:
          ARTIFACT_URL: ${{ steps.expose.outputs.artifact-url }}
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const url = process.env.ARTIFACT_URL;
          if (!url) {
            throw new Error('ARTIFACT_URL is required');
          }
          const blueprint = {
            "$schema": "https://playground.wordpress.net/blueprint-schema.json",
            landingPage: "/wp-admin/post-new.php",
            phpExtensionBundles: [ "kitchen-sink" ],
            steps: [
              {
                step: "login",
                username: "admin",
                password: "password",
              },
              {
                step: "installPlugin",
                pluginZipFile: {
                  resource: "url",
                  url,
                },
                options: { activate: true },
              },
              {
                step: "installPlugin",
                pluginZipFile: {
                  resource: "wordpress.org/plugins",
                  slug: "generateblocks",
                },
                options: { activate: true },
              },
            ],
          };
          console.log(`blueprint=${JSON.stringify(blueprint)}`);
          NODE

      - name: Post Playground Preview Button
        uses: WordPress/action-wp-playground-pr-preview@v2
        with:
          mode:         append-to-description
          blueprint:    ${{ steps.blueprint.outputs.blueprint }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
