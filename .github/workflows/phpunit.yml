name: PHPUnit

on:
  push:
    branches:
      - trunk
      - 'release/**'
    paths:
      - '.github/workflows/phpunit.yml'
      - '**.php'
      - 'phpunit.xml.dist'
      - 'bin/install-wp-tests.sh'
      - 'composer.json'
      - 'composer.lock'
  pull_request:
    branches:
      - trunk
      - 'release/**'
      - 'feature/**'
    paths:
      - '.github/workflows/phpunit.yml'
      - '**.php'
      - 'phpunit.xml.dist'
      - 'bin/install-wp-tests.sh'
      - 'composer.json'
      - 'composer.lock'
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

jobs:
  phpunit:
    name: PHP 7.4 / WP latest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # phpunit/phpunit is pinned to ^7 in composer.json (matching the platform.php
    # 7.4 constraint) — PHPUnit 7 itself doesn't run on PHP 8+, so this stays a
    # single job until that pin is deliberately upgraded, rather than adding a
    # PHP 8.x leg that would just fail on the runner, not on the plugin's code.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mysqli
          tools: composer

      - name: Install PHP dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          composer-options: '--prefer-dist'

      - name: Install SVN (required to fetch the WordPress test suite)
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Set up the WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_test root '' 127.0.0.1 latest

      - name: Run PHPUnit
        run: composer test
