name: E2E — Cookie Notice

on:
  push:
    branches:
      - trunk
      - 'release/**'
    paths:
      - '.github/workflows/e2e-cookie-notice.yml'
      - '.wp-env.json'
      - 'includes/Frontend/CookieNotice.php'
      - 'includes/Admin/Settings.php'
      - 'assets/cookie-notice/**'
      - 'tests/e2e/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches:
      - trunk
      - 'release/**'
      - 'feature/**'
    paths:
      - '.github/workflows/e2e-cookie-notice.yml'
      - '.wp-env.json'
      - 'includes/Frontend/CookieNotice.php'
      - 'includes/Admin/Settings.php'
      - 'assets/cookie-notice/**'
      - 'tests/e2e/**'
      - 'package.json'
      - 'package-lock.json'
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # ubuntu-latest already ships the system libraries Chromium needs for
      # headless rendering; --with-deps additionally apt-get installs a batch
      # of font packages we don't need for these tests and that, on a slow
      # mirror day, can take much longer than the browser download itself —
      # so only run it (once) when the cache is empty.
      - name: Install Playwright browsers (with system deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright browsers (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install chromium

      - name: Start wp-env
        run: npm run wp-env start

      - name: Run e2e tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Stop wp-env
        if: always()
        run: npm run wp-env stop
