name: Attach plugin zip to GitHub Release

# Builds the production zip with `wp dist-archive` (honouring .distignore,
# same tool used for manual releases) and attaches it as an asset to the
# GitHub Release, so it can be installed directly from the Releases page
# without going through WordPress.org.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing release tag to (re)build and attach the zip to — for manually testing this workflow without publishing a new release.'
        required: true

permissions:
  contents: write

jobs:
  build-and-attach:
    name: Build zip and attach to release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag_name || github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build JS/CSS assets
        run: npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
          coverage: none

      - name: Install production Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress --ignore-platform-reqs

      - name: Install WP-CLI and dist-archive-command
        run: |
          curl -sSL -o /usr/local/bin/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /usr/local/bin/wp

          # shivammathur/setup-php writes a github-oauth token into Composer's
          # global auth.json (to avoid GitHub API rate limits during its own
          # setup) that this Composer version's own validation rejects as
          # malformed ("Your github oauth token for github.com contains
          # invalid characters"). Unsetting it here falls back to
          # unauthenticated API access, which is fine for installing this one
          # public package.
          composer config -g --unset github-oauth.github.com || true

          # Pinned to ^3.0 (a tagged release, not dev-main): needed for
          # --filename-format, and it's compatible with the current stable
          # wp-cli.phar despite its composer.json asking for wp-cli/wp-cli ^2.13.
          wp package install wp-cli/dist-archive-command:^3.0

      - name: Build release zip honouring .distignore
        # Target a directory OUTSIDE the checkout (runner.temp), not ./dist:
        # a target inside the plugin directory gets created before the
        # source walk finishes and .distignore has no entry for it, so an
        # empty dist/ folder previously ended up packaged inside the zip.
        run: wp dist-archive . "${{ runner.temp }}/dist" --create-target-dir --filename-format="{name}-{version}"

      - name: Upload zip to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.inputs.tag_name || github.event.release.tag_name }}" "${{ runner.temp }}/dist"/*.zip --repo ${{ github.repository }} --clobber
